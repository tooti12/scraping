<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VFS Booking Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b8cff'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12.5l3.2 3.2L17 9"/></svg>
      </span>
      <span class="dot" id="conn-dot" title="Connection status"></span>
      <h1>VFS Booking Console</h1>
    </div>
    <div class="topbar-step" id="current-step">Idle</div>
  </header>

  <div class="stepper-wrap">
    <div class="stepper" id="stepper"></div>
  </div>

  <main class="layout">
    <section class="panel panel-action" id="prompt-section">
      <h2 class="panel-title">Action Required</h2>
      <div id="prompt-container">
        <div class="empty-state">
          <span class="loader"></span>
          <p class="muted">No action needed right now — waiting on the bot.</p>
        </div>
      </div>
    </section>

    <section class="panel panel-log" id="status-section">
      <h2 class="panel-title">Activity Log</h2>
      <ul id="status-list"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
